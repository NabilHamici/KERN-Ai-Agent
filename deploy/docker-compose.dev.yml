# Local development / CI validation stack.
# Exposes the API on localhost:4000. PostgreSQL remains unpublished.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kern
      POSTGRES_USER: kern
      POSTGRES_PASSWORD: kern_dev_password
    ports:
      # Local/dev only. Production compose never publishes Postgres.
      - '54329:5432'
    volumes:
      - kern_pg_dev_data:/var/lib/postgresql/data
    networks:
      - kern_dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kern -d kern']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      LOG_LEVEL: info
      DATABASE_URL: postgres://kern:kern_dev_password@postgres:5432/kern
      APP_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SMTP_HOST: ''
      SMTP_PORT: 587
      SMTP_SECURE: 'false'
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_FROM_NAME: KERN
      SMTP_FROM_EMAIL: ''
      EMAIL_DEV_MODE: 'true'
    networks:
      - kern_dev
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/v1/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  migrate:
    profiles: ['migrate']
    build:
      context: ../server
      dockerfile: Dockerfile
    command: ['node', 'dist/db/migrate.js']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://kern:kern_dev_password@postgres:5432/kern
      APP_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:5173
      EMAIL_DEV_MODE: 'true'
      SMTP_HOST: ''
      SMTP_FROM_EMAIL: ''
      LOG_LEVEL: info
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kern_dev
    restart: 'no'

volumes:
  kern_pg_dev_data:

networks:
  kern_dev:
